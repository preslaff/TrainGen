# TrainGen SSOT — training scenario manifest
# Language-neutral. Defines intent + semantic targets only.
# Narration text is GENERATED from `goal` + per-step `intent`, never written here.
# Locator priority: testid > label > role+name. Never raw CSS.

defaults:
  base_url: "https://staging.<your-platform>.com"   # demo tenant, NOT prod
  viewport: { width: 1920, height: 1080 }
  fps: 30
  cursor_travel_s: 0.8
  tail_pad_s: 0.4
  langs: [bg, en]
  voices:                       # fixed per language for library consistency
    bg: "voice_bg_calm"
    en: "voice_en_calm"

  # Pre-roll overlays closed during setup (before recording) so they don't blur/obscure
  # the flow. Best-effort: clicked only if present+visible. name_key resolves per-locale
  # (cookie consent renders "Accept All" / "Приеми всички"); literal name kept as a fallback.
  dismiss:
    - { role: button, name_key: "consent.acceptAll", name: "Accept All" }

  # Per-role login for record/verify. Secrets come from env vars (NEVER committed here):
  #   admin key -> TRAINGEN_ADMIN_PASSWORD. Set TRAINGEN_BASE_URL to the live demo tenant.
  login:
    # Admin: POST the key to the Next.js route, which sets the 24h admin_session cookie in the
    # shared jar (more robust than the UI form). Use a platform key (org_id NULL) for full scope.
    admin:
      api:
        route: "/api/admin/login"
        json: { key: { from_env: TRAINGEN_ADMIN_PASSWORD } }
    # Member: magic-link only, unblocked via the STAGING-ONLY test-session endpoint (Option 1,
    # return-token) on the BACKEND, gated by member_test_session_secret + is_demo members.
    # TrainGen POSTs the secret, then visits /member/login/verify?token=… on the frontend — the
    # real /verify path mints the session. Slug must be an is_demo member (seed_demo_tenants.py).
    member:
      api:
        base_env: TRAINGEN_API_BASE_URL
        route: "/api/v1/member/test-session"
        headers: { X-Test-Session-Secret: { from_env: TRAINGEN_MEMBER_TEST_SECRET } }
        json:    { slug: "demo-hotel" }
        visit:   { path: "/member/login/verify?token={token}", await_cookie: member_session }

  # Discovery (Layer 1 Extract) config — namespaced, discovery-only (DESIGN.md R5/§6).
  # Fill in to run `make extract`; env overrides: TRAINGEN_OPENAPI_URL, TRAINGEN_FRONTEND_APP.
  # discovery:
  #   api:      { spec_url: "https://tourism-api.example.com/openapi.json", commit: "" }
  #   frontend: { repo: "wonderful-bg-web", app_dir: "../wonderful-bg-web/app", commit: "" }
  #   ga4:      { property: "properties/XXXX", window_days: 30 }   # used in a later cut
  #   role_gates:
  #     - { prefix: "/admin", role: admin }
  #   # scope/plumbing segments stripped when deriving the resource_hint join key:
  #   scope_segments: [api, admin, member, me, dashboard, portal, auth]

scenarios:

  # Phase 0 dogfood — public, no login/tenant/OTP. Locale-neutral: entry_route + locators
  # carry no language; the run's lang is inserted into the route and *_key locators resolve to
  # the rendered string via the message catalog, so BG records the BG UI and EN the EN UI.
  # Uses the centered Viki concierge (MeetVikiCentered) on the home page — already visible,
  # so no "open chat" step. Sends on Enter (the "Send message" button name is shared with the
  # contact form, so it's ambiguous).
  - scenario_id: concierge-chatbot
    title:
      bg: "Запитване към консиержа Вики"
      en: "Asking the Viki travel concierge"
    role: public
    goal: >
      Show a visitor how to ask the Viki travel concierge a question about Bulgaria
      on the home page and read the assistant's answer.
    entry_route: "/"
    needs_seed_record: false
    destructive: false
    steps:
      - id: type-question
        intent: "Type a travel question into the Viki concierge"
        locator: { placeholder_key: "viki.placeholder", placeholder: "Ask about Bulgaria..." }
        action: fill
        value: "Which Bulgarian towns are best for wine tasting?"
        emphasis: zoom
        settle_ms: 500
      - id: send-question
        intent: "Send the question to the concierge"
        locator: { placeholder_key: "viki.placeholder", placeholder: "Ask about Bulgaria..." }
        action: press
        value: "Enter"
        emphasis: highlight
        settle_ms: 400
      - id: read-answer
        intent: "Wait for the concierge to answer and read its reply"
        action: settle          # streamed reply — dwell until the text stops growing
        emphasis: none
        settle_ms: 1500

  # Phase 0 dogfood #2 — public interactive map (/explore). Mapbox GL via react-map-gl.
  # Validated live (headless + --disable-gpu, SwiftShader WebGL): the basemap paints, the
  # "Zoom in" control unclusters points into DOM pins, and clicking a pin opens the detail
  # card. The map pin is the ONE non-semantic control — it is a real <button> but carries
  # only a CSS class (marker-member), no testid/accessible name, so it uses a FLAGGED css
  # escape hatch (MULTIMODAL §1/§8). PLATFORM TEST-ID GAP: add data-testid to PinMarker.
  - scenario_id: explore-map
    title:
      bg: "Разглеждане на картата с партньори"
      en: "Exploring the partner map"
    role: public
    goal: >
      Show a visitor how to explore tourism partners on the interactive map: zoom into
      a town to reveal individual places, then open one to see its details.
    entry_route: "/explore"
    needs_seed_record: false
    destructive: false
    steps:
      - id: browse-map
        intent: "Take in the interactive map of tourism partners across Bulgaria"
        action: settle          # let the basemap + place data finish loading
        emphasis: none
        settle_ms: 1500
      - id: close-filters
        intent: "Close the filter panel for a full view of the map"
        locator: { role: button, name_key: "explore.closeFilters", name: "Close filters" }   # sidebar open by default, occludes controls
        action: click
        emphasis: highlight
        settle_ms: 600
      - id: zoom-in
        intent: "Zoom into a town to reveal individual places instead of clusters"
        locator: { role: button, name: "Zoom in" }   # Mapbox control — English in all locales
        action: click
        repeat: 5               # each click zooms one level; ~5 unclusters the pins
        repeat_delay_ms: 500
        emphasis: highlight
        settle_ms: 1200
      - id: open-place
        intent: "Open a place on the map to see who the partner is"
        locator: { css: ".marker-member" }   # escape hatch: pin has no testid/name (gap filed)
        action: click
        emphasis: zoom
        settle_ms: 1200
      - id: read-place
        intent: "Read the partner's details in the card that opens"
        action: settle
        emphasis: none
        settle_ms: 2000
      # Guided tour of the card's actions — `point` highlights each control and dwells while
      # the narration explains it, WITHOUT clicking (explain-only beat, no state change).
      - id: explain-view-profile
        intent: "Explain that View profile opens the partner's full page with more detail"
        locator: { role: link, name_key: "memberCard.viewProfile", name: "View profile" }
        action: point
        emphasis: highlight
        settle_ms: 2500
      - id: explain-add-itinerary
        intent: "Explain that Add to Itinerary saves this place to your trip plan"
        locator: { role: button, name_key: "memberCard.addToItinerary", name: "Add to Itinerary" }
        action: point
        emphasis: highlight
        settle_ms: 2500
      - id: explain-book-direct
        intent: "Explain that Book Direct lets you reserve with the partner directly"
        locator: { role: button, name_key: "memberCard.bookDirectButton", name: "Book Direct" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  # Phase 0 dogfood #3 — public partner directory -> a partner's public profile. A connected
  # visitor journey: browse the directory, search, then open a partner to explore their profile.
  # Locale-neutral (entry_route + *_key locators). The directory lists REAL members in random
  # order, so we open "the first card" via a structural href selector (the app builds the
  # correctly-localized /member/<slug> link — we click it rather than construct the route, since
  # the PUBLIC profile is /[locale]/member/<slug>, locale-first, unlike the member dashboard).
  - scenario_id: find-partner
    title:
      bg: "Намиране на партньор в указателя"
      en: "Finding a partner in the directory"
    role: public
    goal: >
      Show a visitor how to browse the tourism partner directory, search and filter it, then
      open a partner's profile to see their offerings, reviews and how to get in touch.
    entry_route: "/directory"
    needs_seed_record: false
    destructive: false
    steps:
      - id: browse-directory
        intent: "Browse the directory of tourism partners across Bulgaria"
        action: settle
        emphasis: none
        settle_ms: 2000
      - id: search-partner
        intent: "Search the directory for the kind of partner you're looking for"
        locator: { placeholder_key: "directory.search", placeholder: "Search businesses..." }
        action: fill
        value: "hotel"
        emphasis: zoom
        settle_ms: 1500
      - id: point-filters
        intent: "Explain that you can narrow results by category, region and price"
        locator: { role: button, name_key: "directory.allCategories", name: "All Categories" }
        action: point
        emphasis: highlight
        settle_ms: 2500
      - id: open-profile
        intent: "Open a partner to see their full profile"
        locator: { css: 'a[href*="/member/"]' }   # first result card; app builds the localized href
        action: click
        emphasis: zoom
        settle_ms: 1800
      - id: view-profile
        intent: "This is the partner's public profile, with their details, offerings and reviews"
        action: settle
        emphasis: none
        settle_ms: 2500
      - id: point-add-itinerary
        intent: "Explain that visitors can add this partner to their trip itinerary"
        locator: { role: button, name_key: "memberProfile.addToItinerary", name: "Add to Itinerary" }
        action: point
        emphasis: highlight
        settle_ms: 2500
      - id: point-write-review
        intent: "Explain that visitors can leave a review to share their experience"
        locator: { role: button, name_key: "memberProfile.writeReview", name: "Write a Review" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  # Phase 0 dogfood #4 — the AI itinerary planner (/plan), the marquee public feature. Free-text
  # path: describe a trip -> Generate -> the AI builds a day-by-day itinerary (~15-25s) -> explore
  # results. The generation wait uses `wait_for` on the results "Save & Share" button (long
  # timeout), so the dwell tracks the real AI latency instead of racing it. Locale-neutral.
  # (The clarification sub-flow is conditional and didn't trigger for this prompt; if it ever
  # does, that's the runtime sub-step-insertion case — handled separately.)
  - scenario_id: plan-trip
    title:
      bg: "Планиране на пътуване с Вики"
      en: "Planning a trip with the AI concierge"
    role: public
    goal: >
      Show a visitor how to describe their ideal trip in plain language and let the AI
      concierge generate a personalised, day-by-day Bulgaria itinerary they can save and map.
    entry_route: "/plan"
    needs_seed_record: false
    destructive: false
    steps:
      - id: open-plan
        intent: "Open the trip planner, where the AI concierge builds your itinerary"
        action: settle
        emphasis: none
        settle_ms: 1800
      - id: describe-trip
        intent: "Describe your ideal trip in your own words"
        locator: { placeholder_key: "aiTrip.placeholder", placeholder: "E.g., I want a relaxing 4-day trip with wine tasting, spa hotels, and scenic mountain views..." }
        action: fill
        value: "A relaxing 3-day trip around Plovdiv with wine tasting and history"
        emphasis: zoom
        settle_ms: 800
      - id: generate
        intent: "Ask the concierge to generate your itinerary"
        locator: { role: button, name_key: "aiTrip.generate", name: "Generate" }
        action: click
        emphasis: highlight
        settle_ms: 800
      - id: await-itinerary
        intent: "The concierge plans your trip day by day, choosing places and timings"
        locator: { role: button, name_key: "trip.saveAndShare", name: "Save & Share" }   # appears on results
        action: wait_for
        timeout_ms: 90000     # AI generation ~15-25s; wait, don't race it
        emphasis: none
        settle_ms: 2500
      - id: view-itinerary
        intent: "Here is your personalised day-by-day plan, with places to visit and the order to see them"
        action: settle
        emphasis: none
        settle_ms: 3000
      - id: point-save-share
        intent: "Explain that you can save your trip and share it with travel companions"
        locator: { role: button, name_key: "trip.saveAndShare", name: "Save & Share" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  # Phase 0 dogfood #5 — become a partner: the benefits page (/founding-member) -> the
  # application (/partner/apply). Showcases EVERY partner benefit, then shows how to apply.
  # Deliberately fills the form but does NOT submit (no junk application; the 3-step indicator
  # already shows the structure). Locale-neutral; the apply CTA is opened via its href (the app
  # builds the localized link). Benefits enumerated in the narration intents below.
  - scenario_id: become-partner
    title:
      bg: "Станете партньор на платформата"
      en: "Becoming a platform partner"
    role: public
    goal: >
      Show a tourism business every benefit of joining Wonderful Bulgaria — reaching European
      tourists with zero commission, the AI concierge, direct bookings, a member dashboard, the
      EU marketing network and community events — then how to start their partner application.
    entry_route: "/founding-member"
    needs_seed_record: false
    destructive: false
    steps:
      - id: open-benefits
        intent: "Introduce joining the platform — reach European tourists with zero commission and AI-driven marketing"
        action: settle
        emphasis: none
        settle_ms: 2200
      - id: view-benefits
        intent: >
          Walk through everything a partner gets from day one: a profile and search listing, the
          AI concierge Viki promoting you, direct commission-free bookings, a member dashboard with
          analytics, the EU-wide marketing network, and access to the partner community and events
        locator: { role: heading, name_key: "pages.foundingMember.package.title", name: "Everything included from day 1" }
        action: point
        emphasis: highlight
        settle_ms: 4500
      - id: start-application
        intent: "Start your partner application"
        locator: { css: 'a[href*="/partner/apply"]' }   # app builds the localized link
        action: click
        emphasis: zoom
        settle_ms: 1800
      - id: enter-business-name
        intent: "Enter your business name to begin the application"
        locator: { placeholder_key: "partner.businessNamePlaceholder", placeholder: "e.g. Hotel Residence Plovdiv" }
        action: fill
        value: "Hotel Morska Zvezda"
        emphasis: zoom
        settle_ms: 500
      - id: enter-email
        intent: "Add the contact email where travellers and the team can reach you"
        locator: { placeholder_key: "trip.emailPlaceholder", placeholder: "your@email.com" }
        action: fill
        value: "contact@morska-zvezda.bg"
        emphasis: zoom
        settle_ms: 500
      - id: enter-phone
        intent: "Add a contact phone number"
        locator: { placeholder_key: "memberDashboard.phonePlaceholder", placeholder: "+359..." }
        action: fill
        value: "+359 52 123 456"
        emphasis: zoom
        settle_ms: 500
      - id: point-next
        intent: "Pick your business type, then continue through the three short steps — business info, location and contact, then details — to submit"
        locator: { role: button, name_key: "partner.next", name: "Next" }
        action: point
        emphasis: highlight
        settle_ms: 2800

  # Member onboarding tour walkthrough. Public-of-the-member flow: log in as the demo member,
  # launch the guided tour ("Take a tour" — works regardless of tour_completed_at), and step
  # through its 12 cards. The record loop clicks THEN dwells, so each "Next" reveals the next
  # card and the dwell+narration describe what's on screen (no off-by-one). All durable
  # role+name locators. The tour is content we WANT (we only dismiss it during the enrich crawl).
  - scenario_id: member-onboarding-tour
    title:
      bg: "Обиколка за нови партньори"
      en: "The member onboarding tour"
    role: member
    goal: >
      Walk a new partner-member through the guided dashboard tour so they know where every
      part of their portal lives — profile, offerings, bookings, analytics and more.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
        action: settle          # let the dashboard's charts/stats finish loading BEFORE the tour,
        emphasis: none           # so "Take a tour" opens it instantly and the cards stay in sync
        settle_ms: 1500
      - id: start-tour
        intent: "Launch the guided onboarding tour from the dashboard"
        locator: { role: button, name_key: "tour.takeTour", name: "Take a tour" }
        action: click
        emphasis: highlight
        settle_ms: 1400
      - id: await-tour
        intent: "The tour opens with a welcome to your member dashboard"
        locator: { role: button, name_key: "tour.next", name: "Next" }   # block until the tour is actually open (it can
        action: wait_for                            # open late); dwell here narrates the welcome card
        emphasis: none
        settle_ms: 1800
      - id: tour-overview
        intent: "Introduce the Overview, where you track your key stats at a glance"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-profile
        intent: "Show the Profile section, where you edit your business details"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-offerings
        intent: "Show Offerings, where you list the services and products you provide"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-marketplace
        intent: "Show the Marketplace, where you discover partner deals and listings"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-events
        intent: "Show Events, where you publish and manage your upcoming events"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-stories
        intent: "Show Stories, where you share updates that reach visitors"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-reviews
        intent: "Show Reviews, where you read and respond to visitor feedback"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-bookings
        intent: "Show Bookings, where you track incoming reservation requests"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-analytics
        intent: "Show Analytics, where you see how visitors find and engage with you"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-qrcodes
        intent: "Show QR codes, which let visitors reach your profile instantly"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-wrapup
        intent: "Reach the final step confirming your setup is complete"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 1200
      - id: finish-tour
        intent: "Finish the tour and return to your dashboard, ready to start"
        locator: { role: button, name_key: "tour.finish", name: "Finish" }
        action: click
        emphasis: zoom
        settle_ms: 1500

  # ── Member dashboard section walkthroughs ──────────────────────────────────────
  # One safe, read-only walkthrough per dashboard section: log in as the demo member,
  # open the section from the sidebar (nav via data-tour — a stable, language-neutral hook),
  # dwell while the narration explains it, then `point` at the section's primary action where
  # one exists (no clicks that mutate data). entry_route + locators are locale-neutral, so each
  # records correctly in BG and EN. The onboarding banner is dismissed pre-roll. Real end-to-end
  # task scenarios (add an offering, edit+save profile, …) are a later, per-section layer.
  - scenario_id: member-profile
    title: { bg: "Вашият бизнес профил", en: "Your business profile" }
    role: member
    goal: >
      Show a partner-member where to edit their public business profile — description,
      contact and media — and how to save changes so visitors see accurate details.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    dismiss: [ { testid: onboarding-banner-dismiss } ]
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
        action: settle
        emphasis: none
        settle_ms: 1200
      - id: go-profile
        intent: "Open the Profile section from the sidebar"
        locator: { css: '[data-tour="nav-profile"]' }
        action: click
        emphasis: highlight
        settle_ms: 1600
      - id: view-profile
        intent: "This is your business profile, where you keep your public details current"
        action: settle
        emphasis: none
        settle_ms: 2500
      - id: point-save
        intent: "Explain that Save Changes publishes your edits so visitors see them"
        locator: { role: button, name_key: "memberDashboard.saveChanges", name: "Save Changes" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  - scenario_id: member-offerings
    title: { bg: "Вашите предложения", en: "Your offerings" }
    role: member
    goal: >
      Show a partner-member where they list the services and products they provide,
      and how to add a new offering.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    dismiss: [ { testid: onboarding-banner-dismiss } ]
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
        action: settle
        emphasis: none
        settle_ms: 1200
      - id: go-offerings
        intent: "Open the Offerings section from the sidebar"
        locator: { css: '[data-tour="nav-offerings"]' }
        action: click
        emphasis: highlight
        settle_ms: 1600
      - id: view-offerings
        intent: "These are your offerings — the services and products visitors can discover"
        action: settle
        emphasis: none
        settle_ms: 2500
      - id: point-add
        intent: "Explain that Add Offering creates a new listing for visitors to find"
        locator: { role: button, name_key: "memberDashboard.addOffering", name: "Add Offering" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  - scenario_id: member-events
    title: { bg: "Вашите събития", en: "Your events" }
    role: member
    goal: >
      Show a partner-member where they publish and manage their upcoming events.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    dismiss: [ { testid: onboarding-banner-dismiss } ]
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
        action: settle
        emphasis: none
        settle_ms: 1200
      - id: go-events
        intent: "Open the Events section from the sidebar"
        locator: { css: '[data-tour="nav-events"]' }
        action: click
        emphasis: highlight
        settle_ms: 1600
      - id: view-events
        intent: "Here you publish and manage the events you host for visitors"
        action: settle
        emphasis: none
        settle_ms: 2500
      - id: point-add
        intent: "Explain that Add Event publishes a new event to your profile"
        locator: { role: button, name_key: "memberDashboard.addEvent", name: "Add Event" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  - scenario_id: member-stories
    title: { bg: "Вашите истории", en: "Your stories" }
    role: member
    goal: >
      Show a partner-member where they share updates and stories that reach visitors.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    dismiss: [ { testid: onboarding-banner-dismiss } ]
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
        action: settle
        emphasis: none
        settle_ms: 1200
      - id: go-stories
        intent: "Open the Stories section from the sidebar"
        locator: { css: '[data-tour="nav-stories"]' }
        action: click
        emphasis: highlight
        settle_ms: 1600
      - id: view-stories
        intent: "Stories let you share updates and news that reach and engage visitors"
        action: settle
        emphasis: none
        settle_ms: 2500
      - id: point-add
        intent: "Explain that Add Story publishes a new update to your audience"
        locator: { role: button, name_key: "memberDashboard.addStory", name: "Add Story" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  - scenario_id: member-reviews
    title: { bg: "Вашите отзиви", en: "Your reviews" }
    role: member
    goal: >
      Show a partner-member where they read visitor feedback and respond to build trust.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    dismiss: [ { testid: onboarding-banner-dismiss } ]
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
