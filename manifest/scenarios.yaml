# TrainGen SSOT — training scenario manifest
# Language-neutral. Defines intent + semantic targets only.
# Narration text is GENERATED from `goal` + per-step `intent`, never written here.
# Locator priority: testid > label > role+name. Never raw CSS.

defaults:
  base_url: "https://staging.<your-platform>.com"   # demo tenant, NOT prod
  viewport: { width: 1920, height: 1080 }
  fps: 30
  cursor_travel_s: 0.8
  tail_pad_s: 0.4
  langs: [bg, en]
  voices:                       # fixed per language for library consistency
    bg: "voice_bg_calm"
    en: "voice_en_calm"

  # Pre-roll overlays closed during setup (before recording) so they don't blur/obscure
  # the flow. Best-effort: clicked only if present+visible. (en-UI cookie consent.)
  dismiss:
    - { role: button, name: "Accept All" }

  # Per-role login for record/verify. Secrets come from env vars (NEVER committed here):
  #   admin key -> TRAINGEN_ADMIN_PASSWORD. Set TRAINGEN_BASE_URL to the live demo tenant.
  login:
    admin:
      route: "/admin/en/login"
      fields:
        - { locator: { placeholder: "Enter admin key" }, from_env: TRAINGEN_ADMIN_PASSWORD }
      submit: { role: button, name: "Sign In" }
    # member: email/OTP verify flow — not a simple fill; left unconfigured until automatable.

  # Discovery (Layer 1 Extract) config — namespaced, discovery-only (DESIGN.md R5/§6).
  # Fill in to run `make extract`; env overrides: TRAINGEN_OPENAPI_URL, TRAINGEN_FRONTEND_APP.
  # discovery:
  #   api:      { spec_url: "https://tourism-api.example.com/openapi.json", commit: "" }
  #   frontend: { repo: "wonderful-bg-web", app_dir: "../wonderful-bg-web/app", commit: "" }
  #   ga4:      { property: "properties/XXXX", window_days: 30 }   # used in a later cut
  #   role_gates:
  #     - { prefix: "/admin", role: admin }
  #   # scope/plumbing segments stripped when deriving the resource_hint join key:
  #   scope_segments: [api, admin, member, me, dashboard, portal, auth]

scenarios:

  # Phase 0 dogfood — public, no login/tenant/OTP. UI locale: /en (en-UI labels).
  # Uses the centered Viki concierge (MeetVikiCentered) on the home page — already visible,
  # so no "open chat" step. Sends on Enter (the "Send message" button name is shared with the
  # contact form, so it's ambiguous).
  - scenario_id: concierge-chatbot
    title:
      bg: "Запитване към консиержа Вики"
      en: "Asking the Viki travel concierge"
    role: public
    goal: >
      Show a visitor how to ask the Viki travel concierge a question about Bulgaria
      on the home page and read the assistant's answer.
    entry_route: "/en"
    needs_seed_record: false
    destructive: false
    steps:
      - id: type-question
        intent: "Type a travel question into the Viki concierge"
        locator: { placeholder: "Ask about Bulgaria..." }
        action: fill
        value: "Which Bulgarian towns are best for wine tasting?"
        emphasis: zoom
        settle_ms: 500
      - id: send-question
        intent: "Send the question to the concierge"
        locator: { placeholder: "Ask about Bulgaria..." }
        action: press
        value: "Enter"
        emphasis: highlight
        settle_ms: 400
      - id: read-answer
        intent: "Wait for the concierge to answer and read its reply"
        action: settle          # streamed reply — dwell until the text stops growing
        emphasis: none
        settle_ms: 1500

  # Phase 0 dogfood #2 — public interactive map (/explore). Mapbox GL via react-map-gl.
  # Validated live (headless + --disable-gpu, SwiftShader WebGL): the basemap paints, the
  # "Zoom in" control unclusters points into DOM pins, and clicking a pin opens the detail
  # card. The map pin is the ONE non-semantic control — it is a real <button> but carries
  # only a CSS class (marker-member), no testid/accessible name, so it uses a FLAGGED css
  # escape hatch (MULTIMODAL §1/§8). PLATFORM TEST-ID GAP: add data-testid to PinMarker.
  - scenario_id: explore-map
    title:
      bg: "Разглеждане на картата с партньори"
      en: "Exploring the partner map"
    role: public
    goal: >
      Show a visitor how to explore tourism partners on the interactive map: zoom into
      a town to reveal individual places, then open one to see its details.
    entry_route: "/en/explore"
    needs_seed_record: false
    destructive: false
    steps:
      - id: browse-map
        intent: "Take in the interactive map of tourism partners across Bulgaria"
        action: settle          # let the basemap + place data finish loading
        emphasis: none
        settle_ms: 1500
      - id: close-filters
        intent: "Close the filter panel for a full view of the map"
        locator: { role: button, name: "Close filters" }   # sidebar is open by default + occludes the map controls
        action: click
        emphasis: highlight
        settle_ms: 600
      - id: zoom-in
        intent: "Zoom into a town to reveal individual places instead of clusters"
        locator: { role: button, name: "Zoom in" }
        action: click
        repeat: 5               # each click zooms one level; ~5 unclusters the pins
        repeat_delay_ms: 500
        emphasis: highlight
        settle_ms: 1200
      - id: open-place
        intent: "Open a place on the map to see who the partner is"
        locator: { css: ".marker-member" }   # escape hatch: pin has no testid/name (gap filed)
        action: click
        emphasis: zoom
        settle_ms: 1200
      - id: read-place
        intent: "Read the partner's details in the card that opens"
        action: settle
        emphasis: none
        settle_ms: 2000

  - scenario_id: add-partner-profile
    title:
      bg: "Добавяне на партньорски профил"
      en: "Adding a partner profile"
    role: admin
    goal: >
      Teach an admin how to create a new tourism partner profile from scratch,
      fill the required fields, and publish it so it appears in search.
    entry_route: "/admin/partners"
    steps:
      - id: open-new-form
        intent: "Open the new-partner form from the partners list"
        locator: { testid: "partners-add-btn" }     # fallback: role=button name="Add partner"
        action: click
        emphasis: highlight
        settle_ms: 800

      - id: enter-name
        intent: "Enter the partner's business name"
        locator: { label: "Business name" }
        action: fill
        value: "Хотел Морска Звезда"
        emphasis: zoom
        settle_ms: 400

      - id: select-category
        intent: "Choose the partner category so it routes to the right section"
        locator: { label: "Category" }
        action: select
        value: "Accommodation"
        emphasis: highlight
        settle_ms: 600

      - id: enter-region
        intent: "Set the region used for location-based search"
        locator: { label: "Region" }
        action: select
        value: "Varna"
        emphasis: none
        settle_ms: 600

      - id: save-draft
        intent: "Save the profile as a draft before publishing"
        locator: { testid: "partner-save-draft" }
        action: click
        emphasis: highlight
        settle_ms: 1200

      - id: publish
        intent: "Publish so the profile becomes visible in search results"
        locator: { testid: "partner-publish" }
        action: click
        emphasis: zoom
        settle_ms: 1500

  - scenario_id: member-update-profile
    title:
      bg: "Редактиране на собствен профил"
      en: "Editing your own profile"
    role: member
    goal: >
      Teach a partner-member how to find their profile, update their
      description and contact info, and save changes.
    entry_route: "/dashboard"
    steps:
      - id: open-my-profile
        intent: "Navigate to your own partner profile from the dashboard"
        locator: { role: "link", name: "My profile" }
        action: click
        emphasis: highlight
        settle_ms: 800

      - id: edit-mode
        intent: "Switch the profile into edit mode"
        locator: { testid: "profile-edit-btn" }
        action: click
        emphasis: highlight
        settle_ms: 600

      - id: update-description
        intent: "Update the public description that visitors read"
        locator: { label: "Description" }
        action: fill
        value: "Семеен хотел на първа линия с гледка към морето."
        emphasis: zoom
        settle_ms: 500

      - id: save-changes
        intent: "Save the changes so they go live"
        locator: { testid: "profile-save" }
        action: click
        emphasis: highlight
        settle_ms: 1200
