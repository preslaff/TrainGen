# TrainGen SSOT — training scenario manifest
# Language-neutral. Defines intent + semantic targets only.
# Narration text is GENERATED from `goal` + per-step `intent`, never written here.
# Locator priority: testid > label > role+name. Never raw CSS.

defaults:
  base_url: "https://staging.<your-platform>.com"   # demo tenant, NOT prod
  viewport: { width: 1920, height: 1080 }
  fps: 30
  cursor_travel_s: 0.8
  tail_pad_s: 0.4
  langs: [bg, en]
  voices:                       # fixed per language for library consistency
    bg: "voice_bg_calm"
    en: "voice_en_calm"

  # Pre-roll overlays closed during setup (before recording) so they don't blur/obscure
  # the flow. Best-effort: clicked only if present+visible. name_key resolves per-locale
  # (cookie consent renders "Accept All" / "Приеми всички"); literal name kept as a fallback.
  dismiss:
    - { role: button, name_key: "consent.acceptAll", name: "Accept All" }

  # Per-role login for record/verify. Secrets come from env vars (NEVER committed here):
  #   admin key -> TRAINGEN_ADMIN_PASSWORD. Set TRAINGEN_BASE_URL to the live demo tenant.
  login:
    # Admin: POST the key to the Next.js route, which sets the 24h admin_session cookie in the
    # shared jar (more robust than the UI form). Use a platform key (org_id NULL) for full scope.
    admin:
      api:
        route: "/api/admin/login"
        json: { key: { from_env: TRAINGEN_ADMIN_PASSWORD } }
    # Member: magic-link only, unblocked via the STAGING-ONLY test-session endpoint (Option 1,
    # return-token) on the BACKEND, gated by member_test_session_secret + is_demo members.
    # TrainGen POSTs the secret, then visits /member/login/verify?token=… on the frontend — the
    # real /verify path mints the session. Slug must be an is_demo member (seed_demo_tenants.py).
    member:
      api:
        base_env: TRAINGEN_API_BASE_URL
        route: "/api/v1/member/test-session"
        headers: { X-Test-Session-Secret: { from_env: TRAINGEN_MEMBER_TEST_SECRET } }
        json:    { slug: "demo-hotel" }
        visit:   { path: "/member/login/verify?token={token}", await_cookie: member_session }

  # Discovery (Layer 1 Extract) config — namespaced, discovery-only (DESIGN.md R5/§6).
  # Fill in to run `make extract`; env overrides: TRAINGEN_OPENAPI_URL, TRAINGEN_FRONTEND_APP.
  # discovery:
  #   api:      { spec_url: "https://tourism-api.example.com/openapi.json", commit: "" }
  #   frontend: { repo: "wonderful-bg-web", app_dir: "../wonderful-bg-web/app", commit: "" }
  #   ga4:      { property: "properties/XXXX", window_days: 30 }   # used in a later cut
  #   role_gates:
  #     - { prefix: "/admin", role: admin }
  #   # scope/plumbing segments stripped when deriving the resource_hint join key:
  #   scope_segments: [api, admin, member, me, dashboard, portal, auth]

scenarios:

  # Phase 0 dogfood — public, no login/tenant/OTP. Locale-neutral: entry_route + locators
  # carry no language; the run's lang is inserted into the route and *_key locators resolve to
  # the rendered string via the message catalog, so BG records the BG UI and EN the EN UI.
  # Uses the centered Viki concierge (MeetVikiCentered) on the home page — already visible,
  # so no "open chat" step. Sends on Enter (the "Send message" button name is shared with the
  # contact form, so it's ambiguous).
  - scenario_id: concierge-chatbot
    title:
      bg: "Запитване към консиержа Вики"
      en: "Asking the Viki travel concierge"
    role: public
    goal: >
      Show a visitor how to ask the Viki travel concierge a question about Bulgaria
      on the home page and read the assistant's answer.
    entry_route: "/"
    needs_seed_record: false
    destructive: false
    steps:
      - id: type-question
        intent: "Type a travel question into the Viki concierge"
        locator: { placeholder_key: "viki.placeholder", placeholder: "Ask about Bulgaria..." }
        action: fill
        value: "Which Bulgarian towns are best for wine tasting?"
        emphasis: zoom
        settle_ms: 500
      - id: send-question
        intent: "Send the question to the concierge"
        locator: { placeholder_key: "viki.placeholder", placeholder: "Ask about Bulgaria..." }
        action: press
        value: "Enter"
        emphasis: highlight
        settle_ms: 400
      - id: read-answer
        intent: "Wait for the concierge to answer and read its reply"
        action: settle          # streamed reply — dwell until the text stops growing
        emphasis: none
        settle_ms: 1500

  # Phase 0 dogfood #2 — public interactive map (/explore). Mapbox GL via react-map-gl.
  # Validated live (headless + --disable-gpu, SwiftShader WebGL): the basemap paints, the
  # "Zoom in" control unclusters points into DOM pins, and clicking a pin opens the detail
  # card. The map pin is the ONE non-semantic control — it is a real <button> but carries
  # only a CSS class (marker-member), no testid/accessible name, so it uses a FLAGGED css
  # escape hatch (MULTIMODAL §1/§8). PLATFORM TEST-ID GAP: add data-testid to PinMarker.
  - scenario_id: explore-map
    title:
      bg: "Разглеждане на картата с партньори"
      en: "Exploring the partner map"
    role: public
    goal: >
      Show a visitor how to explore tourism partners on the interactive map: zoom into
      a town to reveal individual places, then open one to see its details.
    entry_route: "/explore"
    needs_seed_record: false
    destructive: false
    steps:
      - id: browse-map
        intent: "Take in the interactive map of tourism partners across Bulgaria"
        action: settle          # let the basemap + place data finish loading
        emphasis: none
        settle_ms: 1500
      - id: close-filters
        intent: "Close the filter panel for a full view of the map"
        locator: { role: button, name_key: "explore.closeFilters", name: "Close filters" }   # sidebar open by default, occludes controls
        action: click
        emphasis: highlight
        settle_ms: 600
      - id: zoom-in
        intent: "Zoom into a town to reveal individual places instead of clusters"
        locator: { role: button, name: "Zoom in" }   # Mapbox control — English in all locales
        action: click
        repeat: 5               # each click zooms one level; ~5 unclusters the pins
        repeat_delay_ms: 500
        emphasis: highlight
        settle_ms: 1200
      - id: open-place
        intent: "Open a place on the map to see who the partner is"
        locator: { css: ".marker-member" }   # escape hatch: pin has no testid/name (gap filed)
        action: click
        emphasis: zoom
        settle_ms: 1200
      - id: read-place
        intent: "Read the partner's details in the card that opens"
        action: settle
        emphasis: none
        settle_ms: 2000
      # Guided tour of the card's actions — `point` highlights each control and dwells while
      # the narration explains it, WITHOUT clicking (explain-only beat, no state change).
      - id: explain-view-profile
        intent: "Explain that View profile opens the partner's full page with more detail"
        locator: { role: link, name_key: "memberCard.viewProfile", name: "View profile" }
        action: point
        emphasis: highlight
        settle_ms: 2500
      - id: explain-add-itinerary
        intent: "Explain that Add to Itinerary saves this place to your trip plan"
        locator: { role: button, name_key: "memberCard.addToItinerary", name: "Add to Itinerary" }
        action: point
        emphasis: highlight
        settle_ms: 2500
      - id: explain-book-direct
        intent: "Explain that Book Direct lets you reserve with the partner directly"
        locator: { role: button, name_key: "memberCard.bookDirectButton", name: "Book Direct" }
        action: point
        emphasis: highlight
        settle_ms: 2500

  # Member onboarding tour walkthrough. Public-of-the-member flow: log in as the demo member,
  # launch the guided tour ("Take a tour" — works regardless of tour_completed_at), and step
  # through its 12 cards. The record loop clicks THEN dwells, so each "Next" reveals the next
  # card and the dwell+narration describe what's on screen (no off-by-one). All durable
  # role+name locators. The tour is content we WANT (we only dismiss it during the enrich crawl).
  - scenario_id: member-onboarding-tour
    title:
      bg: "Обиколка за нови партньори"
      en: "The member onboarding tour"
    role: member
    goal: >
      Walk a new partner-member through the guided dashboard tour so they know where every
      part of their portal lives — profile, offerings, bookings, analytics and more.
    entry_route: "/member/dashboard"
    needs_seed_record: false
    destructive: false
    steps:
      - id: open-dashboard
        intent: "Arrive on your member dashboard"
        action: settle          # let the dashboard's charts/stats finish loading BEFORE the tour,
        emphasis: none           # so "Take a tour" opens it instantly and the cards stay in sync
        settle_ms: 1500
      - id: start-tour
        intent: "Launch the guided onboarding tour from the dashboard"
        locator: { role: button, name_key: "tour.takeTour", name: "Take a tour" }
        action: click
        emphasis: highlight
        settle_ms: 1400
      - id: await-tour
        intent: "The tour opens with a welcome to your member dashboard"
        locator: { role: button, name_key: "tour.next", name: "Next" }   # block until the tour is actually open (it can
        action: wait_for                            # open late); dwell here narrates the welcome card
        emphasis: none
        settle_ms: 1800
      - id: tour-overview
        intent: "Introduce the Overview, where you track your key stats at a glance"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-profile
        intent: "Show the Profile section, where you edit your business details"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-offerings
        intent: "Show Offerings, where you list the services and products you provide"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-marketplace
        intent: "Show the Marketplace, where you discover partner deals and listings"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-events
        intent: "Show Events, where you publish and manage your upcoming events"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-stories
        intent: "Show Stories, where you share updates that reach visitors"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-reviews
        intent: "Show Reviews, where you read and respond to visitor feedback"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-bookings
        intent: "Show Bookings, where you track incoming reservation requests"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-analytics
        intent: "Show Analytics, where you see how visitors find and engage with you"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-qrcodes
        intent: "Show QR codes, which let visitors reach your profile instantly"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 900
      - id: tour-wrapup
        intent: "Reach the final step confirming your setup is complete"
        locator: { role: button, name_key: "tour.next", name: "Next" }
        action: click
        emphasis: none
        settle_ms: 1200
      - id: finish-tour
        intent: "Finish the tour and return to your dashboard, ready to start"
        locator: { role: button, name_key: "tour.finish", name: "Finish" }
        action: click
        emphasis: zoom
        settle_ms: 1500

  - scenario_id: add-partner-profile
    title:
      bg: "Добавяне на партньорски профил"
      en: "Adding a partner profile"
    role: admin
    goal: >
      Teach an admin how to create a new tourism partner profile from scratch,
      fill the required fields, and publish it so it appears in search.
    entry_route: "/admin/partners"
    steps:
      - id: open-new-form
        intent: "Open the new-partner form from the partners list"
        locator: { testid: "partners-add-btn" }     # fallback: role=button name="Add partner"
        action: click
        emphasis: highlight
        settle_ms: 800

      - id: enter-name
        intent: "Enter the partner's business name"
        locator: { label: "Business name" }
        action: fill
        value: "Хотел Морска Звезда"
        emphasis: zoom
        settle_ms: 400

      - id: select-category
        intent: "Choose the partner category so it routes to the right section"
        locator: { label: "Category" }
        action: select
        value: "Accommodation"
        emphasis: highlight
        settle_ms: 600

      - id: enter-region
        intent: "Set the region used for location-based search"
        locator: { label: "Region" }
        action: select
        value: "Varna"
        emphasis: none
        settle_ms: 600

      - id: save-draft
        intent: "Save the profile as a draft before publishing"
        locator: { testid: "partner-save-draft" }
        action: click
        emphasis: highlight
        settle_ms: 1200

      - id: publish
        intent: "Publish so the profile becomes visible in search results"
        locator: { testid: "partner-publish" }
        action: click
        emphasis: zoom
        settle_ms: 1500

  - scenario_id: member-update-profile
    title:
      bg: "Редактиране на собствен профил"
      en: "Editing your own profile"
    role: member
    goal: >
      Teach a partner-member how to find their profile, update their
      description and contact info, and save changes.
    entry_route: "/dashboard"
    steps:
      - id: open-my-profile
        intent: "Navigate to your own partner profile from the dashboard"
        locator: { role: "link", name: "My profile" }
        action: click
        emphasis: highlight
        settle_ms: 800

      - id: edit-mode
        intent: "Switch the profile into edit mode"
        locator: { testid: "profile-edit-btn" }
        action: click
        emphasis: highlight
        settle_ms: 600

      - id: update-description
        intent: "Update the public description that visitors read"
        locator: { label: "Description" }
        action: fill
        value: "Семеен хотел на първа линия с гледка към морето."
        emphasis: zoom
        settle_ms: 500

      - id: save-changes
        intent: "Save the changes so they go live"
        locator: { testid: "profile-save" }
        action: click
        emphasis: highlight
        settle_ms: 1200
